[package]
name = "game-theory-mcp"
description = "MCP server computing exact game-theoretic answers: Nash equilibria, dominance, subgame perfection, repeated-game thresholds."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["mcp", "game-theory", "nash-equilibrium", "llm", "agent"]
categories = ["mathematics", "science", "command-line-utilities"]

[dependencies]
# `version` alongside `path` is what lets this crate be published: cargo
# rejects a path-only dependency at package time, and consumers resolve the
# version from crates.io.
game-theory-core = { path = "../game-theory-core", version = "0.1.0" }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
num-rational.workspace = true
num-traits.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }
