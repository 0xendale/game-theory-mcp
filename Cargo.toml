[workspace]
resolver = "2"
members = ["crates/game-theory-core", "crates/game-theory-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/0xendale/game-theory-mcp"
homepage = "https://github.com/0xendale/game-theory-mcp"
authors = ["0xendale"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-bigint = { version = "0.4", features = ["serde"] }
thiserror = "2"
proptest = "1"
rmcp = { version = "3.1", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
